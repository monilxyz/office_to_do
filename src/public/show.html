<!-- public/show.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List & Company News</title>
    <style>
        /* CSS Styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .main-container {
            display: flex;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            gap: 20px;
            flex-wrap: wrap;
        }

        .container {
            flex: 1 1 45%; /* Grow and shrink as needed, 45% width */
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            min-width: 300px; /* For smaller screens */
        }

        h1, h2 {
            text-align: center;
            color: #333;
        }

        /* Task Styles */
        #tasks-list .task {
            padding: 15px;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            border-radius: 4px;
            background-color: #fafafa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-details p {
            margin: 5px 0;
        }

        .mark-done {
            padding: 8px 12px;
            background-color: #17a2b8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .mark-done:hover {
            background-color: #138496;
        }

        /* News Styles */
        #news-list .news-item {
            padding: 15px;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            border-radius: 4px;
            background-color: #fff3cd;
        }

        .news-item h3 {
            margin: 0 0 10px 0;
            color: #856404;
        }

        .news-item p {
            margin: 5px 0;
            color: #856404;
        }

        .news-date {
            font-size: 0.9em;
            color: #6c757d;
        }

        .link {
            text-align: center;
            margin-top: 20px;
        }

        .link a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .container {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Task List Container -->
        <div class="container">
            <h1>Task List</h1>
            <button onclick="location.href='/'" style="padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; transition: background-color 0.3s; margin-bottom: 20px;">
                Add New Task
            </button>
            <div id="tasks-list">
                <p>Loading tasks...</p>
            </div>
            <div class="link">
                <a href="/">Add Task & News</a>
            </div>
        </div>

        <!-- Company News Container -->
        <div class="container">
            <h2>Company News</h2>
            <button onclick="location.href='/'" style="padding: 10px 20px; background-color: #ffc107; color: white; border: none; border-radius: 4px; cursor: pointer; transition: background-color 0.3s; margin-bottom: 20px;">
                Add News
            </button>
            <div id="news-list">
                <p>Loading news...</p>
            </div>
            <div class="link">
                <a href="/">Add Task & News</a>
            </div>
        </div>
    </div>

    <script>
        // Function to fetch and display tasks
        function fetchTasks() {
            fetch('/tasks')
                .then(response => response.json())
                .then(data => {
                    const tasksList = document.getElementById('tasks-list');
                    tasksList.innerHTML = '';

                    if (data.length === 0) {
                        tasksList.innerHTML = '<p>No tasks available.</p>';
                        return;
                    }

                    data.forEach(task => {
                        const taskDiv = document.createElement('div');
                        taskDiv.className = 'task';

                        const detailsDiv = document.createElement('div');
                        detailsDiv.className = 'task-details';
                        detailsDiv.innerHTML = `
                            <p><strong>Name:</strong> ${task.name}</p>
                            <p><strong>Work:</strong> ${task.work}</p>
                            <p><strong>Assign Date:</strong> ${task.assign_date}</p>
                            <p><strong>Due Date:</strong> ${task.due_date}</p>
                        `;

                        const markDoneButton = document.createElement('button');
                        markDoneButton.className = 'mark-done';
                        markDoneButton.textContent = 'Mark as Done';
                        // Implement functionality for this button as needed

                        taskDiv.appendChild(detailsDiv);
                        taskDiv.appendChild(markDoneButton);

                        tasksList.appendChild(taskDiv);
                    });
                })
                .catch(error => {
                    console.error('Error fetching tasks:', error);
                    const tasksList = document.getElementById('tasks-list');
                    tasksList.innerHTML = '<p>Error loading tasks.</p>';
                });
        }

        // Function to fetch and display news
        function fetchNews() {
            fetch('/news')
                .then(response => response.json())
                .then(data => {
                    const newsList = document.getElementById('news-list');
                    newsList.innerHTML = '';

                    if (data.length === 0) {
                        newsList.innerHTML = '<p>No news available.</p>';
                        return;
                    }

                    data.forEach(news => {
                        const newsDiv = document.createElement('div');
                        newsDiv.className = 'news-item';

                        const title = document.createElement('h3');
                        title.textContent = news.news_title;

                        const content = document.createElement('p');
                        content.textContent = news.news_content;

                        const date = document.createElement('p');
                        date.className = 'news-date';
                        date.textContent = `Date: ${news.news_date}`;

                        newsDiv.appendChild(title);
                        newsDiv.appendChild(content);
                        newsDiv.appendChild(date);

                        newsList.appendChild(newsDiv);
                    });
                })
                .catch(error => {
                    console.error('Error fetching news:', error);
                    const newsList = document.getElementById('news-list');
                    newsList.innerHTML = '<p>Error loading news.</p>';
                });
        }

        // Fetch tasks and news on page load
        window.onload = function() {
            fetchTasks();
            fetchNews();
        };
    </script>
</body>
</html>
