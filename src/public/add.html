<!-- public/add.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Task & News</title>
    <style>
        /* CSS Styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .main-container {
            display: flex;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            gap: 20px;
            flex-wrap: wrap;
        }

        .container {
            flex: 1 1 45%; /* Grow and shrink as needed, 45% width */
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            min-width: 300px; /* For smaller screens */
        }

        h1 {
            text-align: center;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
            color: #555;
        }

        input[type="text"],
        textarea,
        input[type="date"] {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #218838;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 16px;
            display: none;
        }

        .message.success {
            color: #28a745;
        }

        .message.error {
            color: #dc3545;
        }

        .link {
            text-align: center;
            margin-top: 20px;
        }

        .link a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .container {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Add Task Section -->
        <div class="container">
            <h1>Add New Task</h1>
            <form id="add-task-form">
                <div>
                    <label for="task-name">Name</label>
                    <input type="text" id="task-name" name="name" placeholder="Enter your name" required>
                </div>
                <div>
                    <label for="task-work">Work Description</label>
                    <textarea id="task-work" name="work" rows="4" placeholder="Enter task description" required></textarea>
                </div>
                <div>
                    <label for="task-assign-date">Assign Date</label>
                    <input type="date" id="task-assign-date" name="assign_date" required>
                </div>
                <div>
                    <label for="task-due-date">Due Date</label>
                    <input type="date" id="task-due-date" name="due_date" required>
                </div>
                <button type="submit">Add Task</button>
            </form>
            <div id="task-message" class="message"></div>
            <div class="link">
                <a href="/show">View Tasks and News</a>
            </div>
        </div>

        <!-- Add News Section -->
        <div class="container">
            <h1>Add Company News</h1>
            <form id="add-news-form">
                <div>
                    <label for="news-title">News Title</label>
                    <input type="text" id="news-title" name="news_title" placeholder="Enter news title" required>
                </div>
                <div>
                    <label for="news-content">News Content</label>
                    <textarea id="news-content" name="news_content" rows="4" placeholder="Enter news content" required></textarea>
                </div>
                <div>
                    <label for="news-date">News Date</label>
                    <input type="date" id="news-date" name="news_date" required>
                </div>
                <button type="submit">Add News</button>
            </form>
            <div id="news-message" class="message"></div>
            <div class="link">
                <a href="/show">View Tasks and News</a>
            </div>
        </div>
    </div>

    <script>
        // Handle Task Form Submission
        document.getElementById('add-task-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('task-name').value.trim();
            const work = document.getElementById('task-work').value.trim();
            const assign_date = document.getElementById('task-assign-date').value;
            const due_date = document.getElementById('task-due-date').value;

            const messageDiv = document.getElementById('task-message');

            if (!name || !work || !assign_date || !due_date) {
                messageDiv.textContent = 'Please fill out all task fields.';
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
                return;
            }

            // Send POST request to add task
            fetch('/tasks', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ name, work, assign_date, due_date }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.message === 'Task added successfully!') {
                    messageDiv.textContent = data.message;
                    messageDiv.className = 'message success';
                    messageDiv.style.display = 'block';
                    // Clear the form
                    document.getElementById('add-task-form').reset();
                } else {
                    messageDiv.textContent = data.message || 'Error adding task.';
                    messageDiv.className = 'message error';
                    messageDiv.style.display = 'block';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                messageDiv.textContent = 'Error adding task. Please try again.';
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
            });
        });

        // Handle News Form Submission
        document.getElementById('add-news-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const news_title = document.getElementById('news-title').value.trim();
            const news_content = document.getElementById('news-content').value.trim();
            const news_date = document.getElementById('news-date').value;

            const messageDiv = document.getElementById('news-message');

            if (!news_title || !news_content || !news_date) {
                messageDiv.textContent = 'Please fill out all news fields.';
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
                return;
            }

            // Send POST request to add news
            fetch('/news', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ news_title, news_content, news_date }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.message === 'News added successfully!') {
                    messageDiv.textContent = data.message;
                    messageDiv.className = 'message success';
                    messageDiv.style.display = 'block';
                    // Clear the form
                    document.getElementById('add-news-form').reset();
                } else {
                    messageDiv.textContent = data.message || 'Error adding news.';
                    messageDiv.className = 'message error';
                    messageDiv.style.display = 'block';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                messageDiv.textContent = 'Error adding news. Please try again.';
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
            });
        });
    </script>
</body>
</html>
